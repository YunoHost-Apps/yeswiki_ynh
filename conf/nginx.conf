# Add .mjs as a file extension for javascript
include mime.types;
types {
    text/javascript mjs;
}

#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
location __PATH__/ {

  # Path to source
  alias __INSTALL_DIR__/;

  index index.php;

  # Common parameter to increase upload size limit in conjunction with dedicated php-fpm file
  client_max_body_size 500M;

  try_files $uri $uri/ index.php;
  
  # ActivityPub: actors and webfinger live at the domain root, so they are only
  # served when the wiki itself is installed at the root of the domain
#root_path_only  location ~* ^/actors/(\d+)(/(?:outbox|inbox|followers|following))?$ {
#root_path_only    include fastcgi.conf;
#root_path_only    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
#root_path_only    fastcgi_param QUERY_STRING "api/forms/$1/actor$2";
#root_path_only    fastcgi_param REQUEST_URI "/?api/forms/$1/actor$2";
#root_path_only    fastcgi_pass unix:/var/run/php/php__PHP_VERSION__-fpm-__APP__.sock;
#root_path_only  }

#root_path_only  location = /.well-known/webfinger {
#root_path_only    return 301 /?api/webfinger&$args;
#root_path_only  }

  # private folder for YesWiki
  location ~* /(.*/)?private/ {
    deny all;
    return 403;
  }

  # Allow iframe embedding for pages with /iframe or /editiframe in their name
  if ($request_uri ~* "/(iframe|editiframe)([/?&]|$)") {
    more_clear_headers "X-Frame-Options";
    more_set_headers "Content-Security-Policy: frame-ancestors *";
  }

  # Allow CORS for API routes
  if ($request_uri ~* "[/?]api/") {
    more_set_headers "Access-Control-Allow-Origin: *";
    more_set_headers "Access-Control-Allow-Methods: GET, POST, OPTIONS";
    more_set_headers "Access-Control-Allow-Headers: Authorization, Content-Type";
  }
  
  location ~ [^/]\.php(/|$) {
    fastcgi_pass unix:/var/run/php/php__PHP_VERSION__-fpm-__APP__.sock;
    include fastcgi_params_with_auth;
  }
}
